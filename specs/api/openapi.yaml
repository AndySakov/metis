openapi: 3.1.0
info:
  title: METIS Core API
  version: 0.2.0
  description: >
    The headless Core API. This file is canonical (ADR-004): code conforms to it, not the reverse.

    Every operation carries `x-status`. `implemented` means the endpoint exists in
    `src/ingress/IntentApi.ts` today and is reconciled against this file by
    `test/specs/ApiReconciliation.test.ts` — ADR-011 requires that one validate the other rather
    than the two being maintained in parallel. `planned` means the contract is agreed but the
    endpoint is not built yet; it is marked rather than omitted so this file states what is true.
servers:
  - url: http://localhost:8080
components:
  parameters:
    Identifier:
      name: id
      in: path
      required: true
      schema:
        $ref: ../common/Identifier.schema.json
  responses:
    NotFound:
      description: No such entity
      content:
        application/json:
          schema:
            $ref: ../common/Error.schema.json
    ValidationFailed:
      description: The request did not satisfy its schema
      content:
        application/json:
          schema:
            $ref: ../common/Error.schema.json
paths:
  /intent:
    post:
      operationId: createPlan
      x-status: implemented
      summary: Submit an intent; returns a planned execution
      description: >
        Takes an IntentDraft, not an Intent. The server assigns `id` and `ts`, so requiring them
        from the client would be asking for fields it has no authority to set (ADR-005).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../IntentDraft.schema.json
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                $ref: ../Plan.schema.json
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /plans/{id}:
    get:
      operationId: getPlan
      x-status: implemented
      summary: Get a plan by id
      parameters:
        - $ref: "#/components/parameters/Identifier"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../Plan.schema.json
        "404":
          $ref: "#/components/responses/NotFound"
  /artifacts/{id}:
    get:
      operationId: getArtifact
      x-status: implemented
      summary: Get artifact metadata
      description: >
        Metadata only — never the bytes. ADR-007 separates `head` from `get` precisely so artifacts
        can be listed and referenced without moving payloads.
      parameters:
        - $ref: "#/components/parameters/Identifier"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../Artifact.schema.json
        "404":
          $ref: "#/components/responses/NotFound"
  /artifacts/{id}/content:
    get:
      operationId: getArtifactContent
      x-status: implemented
      summary: Get an artifact's bytes
      description: >
        The payload, exactly as stored. The store verifies it against the checksum recorded at
        write time before it is served (ADR-007); a payload that fails the check is a server error,
        never served and never reported as missing.
      parameters:
        - $ref: "#/components/parameters/Identifier"
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /plans/{id}/execution:
    get:
      operationId: getExecution
      x-status: implemented
      summary: The latest run of a plan
      description: >
        Read from the event log, so it answers the same way whichever path ran the plan. A `restate`
        submission returns before anything has run; this is where its outcome is found, including
        a step parked awaiting approval and the `artifactId` of anything it wrote. A durable run
        re-executes after each approval, and this reports the latest of those runs.
      parameters:
        - $ref: "#/components/parameters/Identifier"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, steps, finishedAt]
                properties:
                  status:
                    type: string
                    enum: [completed, awaiting_approval, denied, failed]
                  steps:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [stepId, status]
                      properties:
                        stepId:
                          $ref: ../common/Identifier.schema.json
                        status:
                          type: string
                          enum: [completed, awaiting_approval, denied, failed, skipped]
                        artifactId:
                          $ref: ../common/Identifier.schema.json
                        detail:
                          type: string
                  finishedAt:
                    $ref: ../common/Timestamp.schema.json
        "404":
          description: No such plan, or the plan has never run.
          content:
            application/json:
              schema:
                $ref: ../common/Error.schema.json
  /plans/{id}/execute:
    post:
      operationId: executePlan
      x-status: implemented
      summary: Execute a plan as a durable workflow
      description: >
        Execution is a Restate workflow (ADR-016), so this returns immediately with an execution id
        and the run continues durably. A step requiring approval suspends the workflow rather than
        polling. Policy is re-evaluated on resume and never restored from a checkpoint.
      parameters:
        - $ref: "#/components/parameters/Identifier"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                approvedSteps:
                  description: >
                    Steps the user has already approved. A gated step not named here parks the run
                    (on the durable path) or ends it awaiting approval (on the direct path).
                  type: array
                  items:
                    $ref: ../common/Identifier.schema.json
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [executionId, mode, status]
                properties:
                  executionId: { type: string }
                  mode:
                    description: >
                      Which path ran it. `restate` is durable — retries, checkpointing and real
                      suspension. `direct` runs in-process and is **not** durable: killing the
                      process loses the run. This is reported rather than hidden so a caller
                      cannot mistake one for the other.
                    type: string
                    enum: [restate, direct]
                  status:
                    type: string
                    enum:
                      [accepted, completed, awaiting_approval, denied, failed]
                  steps:
                    description: >
                      What happened to each step, present when the run finished in-process
                      (`direct`). An `artifactId` names what the step wrote, readable at
                      `/artifacts/{id}/content`. Absent for `restate`, which has only accepted the
                      run when it answers.
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [stepId, status]
                      properties:
                        stepId:
                          $ref: ../common/Identifier.schema.json
                        status:
                          type: string
                          enum: [completed, awaiting_approval, denied, failed, skipped]
                        artifactId:
                          $ref: ../common/Identifier.schema.json
                        detail:
                          type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The plan exists but cannot run as it stands, for instance because the intent it was
            planned from is missing, so policy has nothing to evaluate it against.
  /eventlog/{id}:
    put:
      operationId: appendEvent
      x-status: planned
      summary: Append (idempotent) event to log
      description: >
        Idempotent by id. Replaying an append returns the event already stored rather than
        duplicating it or rewriting its timestamp.
      parameters:
        - $ref: "#/components/parameters/Identifier"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../Event.schema.json
      responses:
        "201": { description: Appended }
        "200": { description: Already present; existing event returned }
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /eventlog:
    get:
      operationId: readEventLog
      x-status: implemented
      summary: Query events by time and type
      description: >
        Read-only. `types` may be repeated. `planId` narrows the log to one plan: the API's records
        of it and every event its runs wrote, policy decisions included, which is how a reader sees
        why a step was gated or denied. `project` is accepted by the store but not yet served here.
      parameters:
        - name: fromTs
          in: query
          schema:
            $ref: ../common/Timestamp.schema.json
        - name: toTs
          in: query
          schema:
            $ref: ../common/Timestamp.schema.json
        - name: types
          in: query
          schema: { type: array, items: { type: string } }
        - name: actor
          in: query
          schema:
            $ref: ../common/Actor.schema.json
        - name: planId
          in: query
          schema:
            $ref: ../common/Identifier.schema.json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: ../Event.schema.json }
  /tools:
    get:
      operationId: listTools
      x-status: implemented
      summary: List registered tool implementations
      description: >
        Only tools whose server answered for them at startup are registered, so this is what the
        planner can actually target, not every descriptor in specs/tools/.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: ../ToolSpec.schema.json }
  /packs:
    get:
      operationId: listPacks
      x-status: implemented
      summary: The packs METIS was started with
      description: >
        Each pack loaded from METIS_PACKS (specs/packs/Pack.schema.json): the capabilities its
        descriptors bind, and the goals it offers the console as examples. Empty when no pack is
        loaded.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [name, version, description, capabilities, examples]
                  properties:
                    name: { $ref: ../packs/Pack.schema.json#/$defs/PackName }
                    version: { type: string, minLength: 1 }
                    description: { type: string, minLength: 1 }
                    capabilities:
                      type: array
                      items: { $ref: ../common/CapabilityId.schema.json }
                    examples:
                      type: array
                      items: { $ref: ../packs/Pack.schema.json#/$defs/Example }
  /trust:
    get:
      operationId: listTrust
      x-status: implemented
      summary: The gear each skill has earned
      description: >
        Derived from the event log at the moment of the request (ADR-014): every registered skill,
        and any with history in the log, with both ledgers' scores, the age-weighted evidence each
        rests on, and the gear they support. A skill with no history is at S0.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [skill, competence, compliance, gear, updatedAt, competenceSignals, complianceSignals]
                  properties:
                    skill: { type: string, minLength: 1 }
                    competence: { type: number, minimum: 0, maximum: 1 }
                    compliance: { type: number, minimum: 0, maximum: 1 }
                    gear: { type: string, enum: [S0, S1, S2, S3, S4] }
                    updatedAt:
                      $ref: ../common/Timestamp.schema.json
                    competenceSignals: { type: number, minimum: 0 }
                    complianceSignals: { type: number, minimum: 0 }
  /tools/validate:
    post:
      operationId: validateTool
      x-status: planned
      summary: Validate a ToolSpec against its schemas and conformance vectors
      description: >
        ADR-006's registry rules: schema validation, declared scopes, and at least one passing
        conformance vector per capability version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../ToolSpec.schema.json
      responses:
        "200":
          description: Validation report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [valid, errors]
                properties:
                  valid: { type: boolean }
                  errors: { type: array, items: { type: string } }
